version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    # @fission-ai/openspec is an EXACT, deliberate pin: pinned-versions.json and
    # the runtime guard ("OpenSpec <v> required") hold the same version, and
    # Desktop bundles that exact copy for offline project-add. A bot bump
    # (1.4.1 → 1.13.0 in #367) trips the guard in every test job; bump it by
    # hand in both repos instead.
    ignore:
      - dependency-name: "@fission-ai/openspec"
    groups:
      compatible-development:
        dependency-type: development
        update-types: [minor, patch]
      compatible-runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    groups:
      compatible-actions:
        update-types: [minor, patch]
