name: CI

on:
  push:
    branches: [main]
  # Stacked engine PRs target integration branches and require the same gates.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Every OS/Node combination runs one complete partition set (validated by
  # scripts/ci-tests.test.mjs). Vitest parallelizes files, not tests within a
  # file, so the runtime suites are split by test line; Windows also shards the
  # remaining suites and isolates the serial recovery suite, and macOS (5
  # concurrent runners) combines slices into three similar-length jobs. Ubuntu/Node 24 is
  # covered by the coverage partitions below. Slowest jobs are listed first so
  # they start first when the runner pool is saturated.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.node }}, ${{ matrix.partition }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, node: '22.22.3', partition: runtime-2/3+runtime-3/3 }
          - { os: macos-latest, node: '22.22.3', partition: general-1/2+runtime-1/3 }
          - { os: macos-latest, node: '22.22.3', partition: general-2/2+recovery }
          - { os: macos-latest, node: '24', partition: runtime-2/3+runtime-3/3 }
          - { os: macos-latest, node: '24', partition: general-1/2+runtime-1/3 }
          - { os: macos-latest, node: '24', partition: general-2/2+recovery, package: true }
          - { os: windows-latest, node: '22.22.3', partition: runtime-1/3 }
          - { os: windows-latest, node: '22.22.3', partition: runtime-2/3 }
          - { os: windows-latest, node: '22.22.3', partition: runtime-3/3 }
          - { os: windows-latest, node: '22.22.3', partition: general-1/2 }
          - { os: windows-latest, node: '22.22.3', partition: general-2/2 }
          - { os: windows-latest, node: '22.22.3', partition: recovery }
          - { os: windows-latest, node: '24', partition: runtime-1/3 }
          - { os: windows-latest, node: '24', partition: runtime-2/3 }
          - { os: windows-latest, node: '24', partition: runtime-3/3 }
          - { os: windows-latest, node: '24', partition: general-1/2, package: true }
          - { os: windows-latest, node: '24', partition: general-2/2 }
          - { os: windows-latest, node: '24', partition: recovery }
          - { os: ubuntu-latest, node: '22.22.3', partition: runtime-1/2 }
          - { os: ubuntu-latest, node: '22.22.3', partition: runtime-2/2 }
          - { os: ubuntu-latest, node: '22.22.3', partition: general }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Release guard regressions (portable Node test invocation)
        run: node --test scripts/release-utils.test.mjs scripts/ci-tests.test.mjs
      - run: node scripts/ci-tests.mjs "${{ matrix.partition }}"
      - name: Install and exercise the actual npm package on this OS
        if: matrix.package
        run: node scripts/verify-package.mjs "${{ runner.temp }}/core-package"

  # Coverage runs the same complete set on Ubuntu/Node 24, recording v8 coverage
  # and a Vitest blob per partition. The `coverage` job merges them, enforces
  # the configured thresholds on the merged report and only then verifies and
  # uploads the exact package approved for release.
  coverage-partition:
    name: coverage (${{ matrix.partition }})
    strategy:
      fail-fast: false
      matrix:
        partition: [runtime-1/3, runtime-2/3, runtime-3/3, general]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/ci-tests.mjs "${{ matrix.partition }}" --blob "${{ runner.temp }}/coverage-blobs"
      - name: Name the blob artifact after the partition
        id: slug
        env:
          PARTITION: ${{ matrix.partition }}
        run: echo "slug=${PARTITION//\//-of-}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-blob-${{ steps.slug.outputs.slug }}
          path: ${{ runner.temp }}/coverage-blobs/blob-*.json
          if-no-files-found: error
          retention-days: 3

  coverage:
    needs: coverage-partition
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-blob-*
          path: ${{ runner.temp }}/coverage-blobs
          merge-multiple: true
      - name: Merge partition coverage and enforce thresholds
        run: node scripts/ci-tests.mjs merge "${{ runner.temp }}/coverage-blobs"
      - run: npm run build
      - name: Install and exercise the exact package approved for release
        run: node scripts/verify-package.mjs "${{ runner.temp }}/core-package"
      - name: Preserve the exact package approved for release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-package
          path: ${{ runner.temp }}/core-package/
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # Desktop <-> Core contract versioning (docs/release-policy.md): a changed
  # integration-contract.json must bump schemaVersion; removals and type
  # changes need a major bump plus a `!`/BREAKING CHANGE declaration.
  contract-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Require a schemaVersion bump for contract changes
        env:
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha }}
          CONTRACT_HEAD_REF: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-contract-bump.mjs

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow expressions and action inputs
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl --fail --silent --show-error --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan for secrets
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --redact --exit-code 1'

  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  engine-robustness:
    name: Installed engine recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x64 }
          - { os: macos-15, arch: arm64 }
          - { os: windows-latest, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify installed package and real CLI crash recovery
        env:
          SPECRAILS_VERIFY_ENGINE_ROBUSTNESS: '1'
        run: node scripts/verify-package.mjs engine-robustness-results
      - name: Preserve acceptance and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-robustness-${{ matrix.os }}-${{ matrix.arch }}
          path: engine-robustness-results/
          if-no-files-found: error
          retention-days: 14

  definition-evaluation:
    name: Offline definition corpus (${{ matrix.definition }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        definition: [implementation, implementation-component]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Execute all independent behavioral oracles without paid providers
        env:
          DEFINITION_ID: ${{ matrix.definition }}
        run: node scripts/evaluate-definition-corpus.mjs "$DEFINITION_ID" definition-evaluation-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: definition-evaluation-${{ matrix.definition }}
          path: definition-evaluation-results/
          if-no-files-found: error
          retention-days: 14

  engine-spikes:
    name: Engine spikes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x64 }
          - { os: macos-15, arch: arm64 }
          - { os: windows-latest, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Verify target architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if(process.arch!==process.env.EXPECTED_ARCH)throw Error('Wrong spike architecture')"
      - run: npm ci
      - name: Exercise crash recovery, subgraphs and committed streams
        run: npm run test:engine-spikes
      - name: Install and exercise the real package with Desktop Node
        run: node scripts/verify-package.mjs engine-spike-results/package
      - name: Check out the exact paired Desktop assembler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fjpulidop/specrails-desktop
          ref: 70c9e8a4a7fbc26b89ed5ac724aed97dfcc27d9f
          path: engine-spike-desktop
          persist-credentials: false
      - name: Install the assembler's locked production dependencies
        run: npm ci --prefix engine-spike-desktop --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Assemble the Core source with the paired Desktop script
        run: node scripts/check-engine-spike-assembly.mjs --desktop engine-spike-desktop --dest "${{ runner.temp }}/core-engine-assembly" --output engine-spike-results/desktop-assembly.json
      - name: Preserve measured evidence, including failed gates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-spikes-${{ matrix.os }}-${{ matrix.arch }}
          path: engine-spike-results/
          if-no-files-found: error
          retention-days: 14
